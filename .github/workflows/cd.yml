name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  IMAGE_NAME: registry.digitalocean.com/dialitech/api-dialitech
  SBOM_FILE: bom.cdx.json

jobs:
  build-and-deploy:
    name: Build, Scan and Deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # docker/setup-buildx-action@v4.2.0

      - name: Verify secrets and variables
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::DIGITALOCEAN_ACCESS_TOKEN no existe o llega vacio. Verifica: Settings > Secrets and variables > Actions > pestana 'Secrets' (NO 'Variables'), nombre exacto, y que no este solo en un Environment distinto a 'production'."
            exit 1
          fi
          echo "OK: DIGITALOCEAN_ACCESS_TOKEN presente (longitud: $(printf '%s' "$DO_TOKEN" | wc -c))"
          if [ -z "$DO_APP_ID" ]; then
            echo "::warning::DIGITALOCEAN_APP_ID vacia; el paso final de deploy fallara. Verifica: Settings > Secrets and variables > Actions > pestana 'Variables'."
          else
            echo "OK: DIGITALOCEAN_APP_ID presente"
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate with DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # docker/build-push-action@v6
        with:
          context: .
          file: API.Dialitech/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@7c2007bcb556501da015201bcba5aa14069b74e2 # aquasecurity/trivy-action@v0.23.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy image scan SARIF
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # github/codeql-action@v3
        with:
          sarif_file: trivy-image.sarif
        if: always() && hashFiles('trivy-image.sarif') != ''

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@7c2007bcb556501da015201bcba5aa14069b74e2 # aquasecurity/trivy-action@v0.23.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'
          format: 'cyclonedx'
          output: '${{ env.SBOM_FILE }}'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ${{ env.SBOM_FILE }}
        if: always() && hashFiles('bom.cdx.json') != ''

      - name: Deploy to DigitalOcean App Platform
        run: |
          sed "s/__IMAGE_TAG__/sha-${GITHUB_SHA}/" .do/app.yaml > .do/app.deploy.yaml
          doctl apps update ${{ vars.DIGITALOCEAN_APP_ID }} --spec .do/app.deploy.yaml --wait
        env:
          MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}